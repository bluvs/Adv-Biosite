        <style>
            :root {
                --red: #c1121f;
                --red-glow: #ff2e3f;
                --wine: #5c0a14;
                --bg: #050304;
                --text: #f3e9ea;
                --muted: #a58c8f;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                padding: 32px 0;
                background: var(--bg);
                color: var(--text);
                font-family: 'JetBrains Mono', monospace;
                overflow-x: hidden;
                display: grid;
                place-items: center;
                --beat: 0;
            }

            @media (hover: hover) and (pointer: fine) {
                body, body * {
                    cursor: none !important;
                }

                #cursor {
                    position: fixed;
                    left: 0;
                    top: 0;
                    z-index: 100;
                    pointer-events: none;
                    width: 10px;
                    height: 10px;
                    margin: -5px 0 0 -5px;
                    border-radius: 50%;
                    background: var(--red-glow);
                    box-shadow: 0 0 10px var(--red-glow), 0 0 22px rgba(255,46,63,.6);
                    transition: width .2s, height .2s, margin .2s, background .2s;
                }

                #cursor.hover {
                    width: 26px;
                    height: 26px;
                    margin: -13px 0 0 -13px;
                    background: rgba(255,46,63,.15);
                    border: 1.5px solid var(--red-glow);
                }
            }

            @media not ((hover: hover) and (pointer: fine)) {
                #cursor {
                    display: none;
                }
            }

                position: fixed;
                inset: 0;
                z-index: -1;
                pointer-events: none;

                opacity: calc(var(--beat) * .3);

            .vignette {
                position: fixed;
                inset: 0;
                z-index: -2;
                background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.85) 100%);
            }

            .scan {
                position: fixed;
                inset: 0;
                z-index: 5;
                pointer-events: none;
                background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px);
                mix-blend-mode: overlay;
            }

            canvas#sparks {
                position: fixed;
                inset: 0;
                z-index: -1;
            }

            #enter {
                position: fixed;
                inset: 0;
                z-index: 20;
                display: grid;
                place-items: center;
                background: #030102;
                cursor: pointer;
                transition: opacity .7s ease, visibility .7s;
            }

            body:not(.in) {
                overflow: hidden;
            }

            #enter.hide {
                opacity: 0;
                visibility: hidden;
            }

            .boot {
                width: min(420px, calc(100% - 32px));
                font-size: 13px;
                line-height: 1.8;
                color: #b9a5a8;
            }

            .boot {
                display: grid;
                place-items: center;
            }

            .boot > * {
                grid-area: 1 / 1;
            }

            .boot-log {
                white-space: pre;
                transition: opacity .5s;
            }

            .boot-log.gone {
                opacity: 0;
            }

            .boot-log .p {
                color: var(--red-glow);
            }

            .boot-log .hi {
                color: var(--text);
            }

            .boot-log .dim {
                color: #5e4a4d;
            }

            .boot-caret {
                display: inline-block;
                width: .55em;
                height: 1.05em;
                background: var(--red-glow);
                vertical-align: -2px;
                animation: blink 1s steps(1) infinite;
            }

            @keyframes blink {
                50% {
                    opacity: 0;
                }
            }

            .boot-enter {
                text-align: center;
                font-family: 'Orbitron', sans-serif;
                letter-spacing: .5em;
                font-size: clamp(12px, 2.4vw, 15px);
                color: var(--muted);
                opacity: 0;
                transition: opacity .6s;
            }

            .boot.done .boot-enter {
                opacity: 1;
                animation: pulse 1.8s ease-in-out infinite;
            }

            @keyframes pulse {
                50% {
                    color: var(--red-glow);
                    text-shadow: 0 0 18px var(--red-glow);
                }
            }

            .card {
                position: relative;
                width: min(420px, calc(100vw - 32px));
                padding: 44px 28px 30px;
                border-radius: 22px;
                background: rgba(12, 6, 8, .55);
                backdrop-filter: blur(18px) saturate(1.4);
                text-align: center;
                transform-style: preserve-3d;
                transition: transform .15s ease-out;
                opacity: 0;
                translate: 0 30px;
            }

            body.in .card {
                animation: rise 1s cubic-bezier(.2,.9,.2,1) .2s forwards;
            }

            @keyframes rise {
                to {
                    opacity: 1;
                    translate: 0 0;
                }
            }

            .card::before {
                content: "";
                position: absolute;
                inset: -1.5px;
                border-radius: inherit;
                z-index: -1;
                background: conic-gradient(from var(--a), transparent 0 60%, var(--red-glow) 75%, #fff 80%, var(--red) 85%, transparent 95%);
                animation: spin 4s linear infinite;
                -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
                -webkit-mask-composite: xor;
                mask-composite: exclude;
                padding: 1.5px;
            }

            @property --a {
                syntax: '<angle>';
                initial-value: 0deg;
                inherits: false;
            }

            @keyframes spin {
                to {
                    --a: 360deg;
                }
            }

            .avatar-wrap {
                position: relative;
                width: 150px;
                height: 150px;
                margin: 0 auto 22px;
            }

            .avatar-wrap::before {
                content: "";
                position: absolute;
                inset: -6px;
                border-radius: 50%;
                background: conic-gradient(var(--red-glow), var(--wine), var(--red-glow), #fff, var(--red-glow));
                animation: rot 3s linear infinite;
                filter: blur(1px);
            }

            .avatar-wrap::after {
                content: "";
                position: absolute;
                inset: -18px;
                border-radius: 50%;
                background: radial-gradient(circle, rgba(255,46,63,.45), transparent 70%);
                animation: breathe 3s ease-in-out infinite;
                z-index: -1;
            }

            .flip {
                position: relative;
                width: 100%;
                height: 100%;
                transform-style: preserve-3d;
                transition: transform .9s cubic-bezier(.3,1.35,.45,1);
            }

            .flip.on {
                transform: rotateY(180deg);
            }

            .flip .avatar {
                position: absolute;
                inset: 0;
                backface-visibility: hidden;
                -webkit-backface-visibility: hidden;
            }

            .flip .back {
                transform: rotateY(180deg);
                display: grid;
                place-items: center;
                background: radial-gradient(circle at 50% 40%, #2a070d, #0a0305 70%);
                font-family: 'Orbitron', sans-serif;
                font-weight: 900;
                font-size: 22px;
                letter-spacing: .08em;
                color: var(--text);
                text-shadow: 0 0 12px var(--red-glow), 0 0 26px rgba(255,46,63,.6);
            }

            @keyframes rot {
                to {
                    transform: rotate(360deg);
                }
            }

            @keyframes breathe {
                50% {
                    transform: scale(1.15);
                    opacity: .6;
                }
            }

            .avatar {
                position: relative;
                width: 100%;
                height: 100%;
                border-radius: 50%;
                object-fit: cover;
                object-position: center 38%;
                border: 4px solid var(--bg);
            }

            .status {
                --s: #747f8d;
                position: absolute;
                right: 10px;
                bottom: 10px;
                width: 20px;
                height: 20px;
                border-radius: 50%;
                background: var(--s);
                border: 4px solid var(--bg);
                box-shadow: 0 0 10px var(--s);
                transition: background .3s, box-shadow .3s;
            }

            .status[data-s="online"] {
                --s: #23d160;
            }

            .status[data-s="idle"] {
                --s: #f0b232;
            }

            .status[data-s="dnd"] {
                --s: #f23f43;
            }

            .presence {
                margin-top: 8px;
                display: flex;
                justify-content: center;
                align-items: center;
                flex-wrap: wrap;
                gap: 6px 14px;
                font-size: 12px;
                color: var(--muted);
            }

            .presence .act {
                color: var(--text);
                max-width: 100%;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .presence .act:empty {
                display: none;
            }

            .presence svg {
                width: 13px;
                height: 13px;
                fill: currentColor;
                vertical-align: -2px;
                margin-right: 5px;
            }

            .clock b {
                color: var(--text);
                font-weight: 600;
            }

            .nick {
                position: relative;
                font-family: 'Orbitron', sans-serif;
                font-weight: 900;
                font-size: clamp(38px, 11vw, 52px);
                letter-spacing: .06em;
                background: linear-gradient(90deg, #fff, var(--red-glow), #fff, var(--red-glow), #fff);
                background-size: 300% 100%;
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                animation: shine 5s linear infinite;
                filter: drop-shadow(0 0 14px rgba(255,46,63,.55));
                display: inline-block;
            }

            @keyframes shine {
                to {
                    background-position: 300% 0;
                }
            }

            .nick::before, .nick::after {
                content: attr(data-text);
                position: absolute;
                inset: 0;
                -webkit-text-fill-color: currentColor;
                opacity: .8;
            }

            .nick::before {
                color: #ff003c;
                animation: glitch1 3.2s infinite steps(1);
            }

            .nick::after {
                color: #00e5ff;
                animation: glitch2 3.2s infinite steps(1);
            }

            @keyframes glitch1 {
                0%, 88%, 100% {
                    clip-path: inset(100% 0 0 0);
                    transform: none;
                }

                89% {
                    clip-path: inset(10% 0 60% 0);
                    transform: translate(-4px, -1px);
                }

                92% {
                    clip-path: inset(55% 0 20% 0);
                    transform: translate(3px, 1px);
                }

                95% {
                    clip-path: inset(30% 0 45% 0);
                    transform: translate(-2px, 0);
                }
            }

            @keyframes glitch2 {
                0%, 88%, 100% {
                    clip-path: inset(100% 0 0 0);
                    transform: none;
                }

                90% {
                    clip-path: inset(65% 0 5% 0);
                    transform: translate(4px, 1px);
                }

                93% {
                    clip-path: inset(15% 0 70% 0);
                    transform: translate(-3px, -1px);
                }

                96% {
                    clip-path: inset(40% 0 35% 0);
                    transform: translate(2px, 0);
                }
            }

            .langs {
                margin: 22px 0 24px;
            }

            .langs-label {
                font-size: 11px;
                letter-spacing: .2em;
                text-transform: uppercase;
                color: var(--muted);
                margin-bottom: 12px;
            }

            .tags {
                display: flex;
                gap: 8px;
                justify-content: center;
                flex-wrap: wrap;
            }

            .tag {
                display: inline-flex;
                align-items: center;
                gap: 7px;
                font-size: 12px;
                font-weight: 600;
                padding: 6px 12px;
                border-radius: 999px;
                border: 1px solid rgba(255,46,63,.3);
                background: rgba(193,18,31,.1);
                color: var(--text);
                transition: transform .2s, border-color .2s, box-shadow .2s;
                opacity: 0;
                translate: 0 8px;
            }

            .tag img, .tag svg {
                width: 16px;
                height: 16px;
                flex: none;
                filter: drop-shadow(0 0 4px rgba(255,255,255,.15));
            }

            .tag img + img {
                margin-left: -4px;
            }

            .tag:hover {
                transform: translateY(-3px);
                border-color: var(--red-glow);
                box-shadow: 0 6px 18px rgba(255,46,63,.35);
            }

            body.in .tag {
                animation: pop .5s ease forwards;
            }

            body.in .tag:nth-child(1) {
                animation-delay: .7s;
            }

            body.in .tag:nth-child(2) {
                animation-delay: .78s;
            }

            body.in .tag:nth-child(3) {
                animation-delay: .86s;
            }

            body.in .tag:nth-child(4) {
                animation-delay: .94s;
            }

            body.in .tag:nth-child(5) {
                animation-delay: 1.02s;
            }

            body.in .tag:nth-child(6) {
                animation-delay: 1.1s;
            }

            body.in .tag:nth-child(7) {
                animation-delay: 1.18s;
            }

            body.in .tag:nth-child(8) {
                animation-delay: 1.26s;
            }

            @keyframes pop {
                to {
                    opacity: 1;
                    translate: 0 0;
                }
            }

            .links {
                display: flex;
                justify-content: center;
                gap: 12px;
            }

            .links a {
                width: 46px;
                height: 46px;
                display: grid;
                place-items: center;
                border-radius: 14px;
                background: rgba(255,255,255,.05);
                border: 1px solid rgba(255,255,255,.08);
                color: var(--text);
                transition: transform .25s, background .25s, box-shadow .25s, color .25s;
            }

            .links a:hover {
                transform: translateY(-4px);
                background: var(--red);
                color: #fff;
                box-shadow: 0 8px 24px rgba(255,46,63,.5);
            }

            .links svg {
                width: 22px;
                height: 22px;
                fill: currentColor;
            }

            .links a {
                position: relative;
            }

            .links a::after {
                content: attr(data-tip);
                position: absolute;
                bottom: calc(100% + 10px);
                left: 50%;
                translate: -50% 4px;
                white-space: nowrap;
                font-size: 11px;
                padding: 5px 9px;
                border-radius: 8px;
                background: rgba(10,4,6,.92);
                border: 1px solid rgba(255,46,63,.4);
                color: var(--text);
                opacity: 0;
                pointer-events: none;
                transition: opacity .2s, translate .2s;
            }

            .links a:hover::after {
                opacity: 1;
                translate: -50% 0;
            }

            #sc {
                position: fixed;
                left: -9999px;
                top: 0;
                width: 300px;
                height: 166px;
                border: 0;
            }

            .player {
                margin-top: 22px;
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 12px;
                border-radius: 14px;
                background: rgba(255,255,255,.04);
                border: 1px solid rgba(255,255,255,.07);
                text-align: left;
            }

            .player button {
                flex: none;
                width: 36px;
                height: 36px;
                border-radius: 50%;
                border: 0;
                cursor: pointer;
                background: var(--red);
                color: #fff;
                display: grid;
                place-items: center;
                box-shadow: 0 0 14px rgba(255,46,63,.5);
                transition: transform .2s;
            }

            .player button:hover {
                transform: scale(1.08);
            }

            .player button svg {
                width: 16px;
                height: 16px;
                fill: currentColor;
            }

            .player .meta {
                flex: 1;
                min-width: 0;
            }

            .player .title {
                font-size: 12px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .player .bar {
                padding: 5px 0;
                margin-top: 2px;
                cursor: pointer;
            }

            .player .bar-in {
                height: 3px;
                border-radius: 3px;
                background: rgba(255,255,255,.1);
                overflow: hidden;
                transition: height .15s;
            }

            .player .bar:hover .bar-in {
                height: 5px;
            }

            .player .fill {
                height: 100%;
                width: 0;
                background: linear-gradient(90deg, var(--wine), var(--red-glow));
                box-shadow: 0 0 8px var(--red-glow);
            }

            .player .time {
                display: flex;
                justify-content: space-between;
                font-size: 10px;
                color: var(--muted);
                font-variant-numeric: tabular-nums;
            }

            .vol {
                display: flex;
                align-items: center;
                flex: none;
            }

            .player .vol-btn {
                width: 28px;
                height: 28px;
                background: none;
                box-shadow: none;
                color: var(--muted);
            }

            .player .vol-btn:hover {
                color: var(--text);
                transform: none;
            }

            .player .vol-btn svg {
                width: 18px;
                height: 18px;
            }

            .vol input {
                width: 0;
                opacity: 0;
                margin: 0;
                accent-color: var(--red-glow);
                transition: width .25s, opacity .25s, margin .25s;
            }

            .vol:hover input, .vol input:focus {
                width: 64px;
                opacity: 1;
                margin-right: 4px;
            }

            @media (hover: none) {
                .vol input {
                    display: none;
                }
            }

            .eq {
                display: flex;
                gap: 2px;
                align-items: flex-end;
                height: 16px;
                flex: none;
            }

            .eq i {
                width: 3px;
                background: var(--red-glow);
                border-radius: 1px;
                height: 3px;
            }

            .playing .eq i {
                animation: eq .8s ease-in-out infinite;
            }

            .eq i:nth-child(2) {
                animation-delay: .2s !important;
            }

            .eq i:nth-child(3) {
                animation-delay: .4s !important;
            }

            .eq i:nth-child(4) {
                animation-delay: .1s !important;
            }

            @keyframes eq {
                50% {
                    height: 16px;
                }
            }

            .term {
                position: fixed;
                right: 20px;
                bottom: 20px;
                z-index: 10;
                width: min(360px, calc(100vw - 32px));
                border-radius: 12px;
                background: rgba(8,3,5,.82);
                backdrop-filter: blur(14px);
                border: 1px solid rgba(255,46,63,.25);
                box-shadow: 0 12px 40px rgba(0,0,0,.6), 0 0 24px rgba(255,46,63,.12);
                text-align: left;
                font-size: 12px;
                overflow: hidden;
                opacity: 0;
                translate: 0 20px;
                pointer-events: none;
                transition: opacity .6s ease 1s, translate .6s ease 1s;
            }

            body.in .term {
                opacity: 1;
                translate: 0 0;
                pointer-events: auto;
            }

            .term.min .term-body {
                display: none;
            }

            .term.min .term-bar {
                border-bottom: 0;
            }

            .term-bar {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 7px 10px;
                background: rgba(255,255,255,.04);
                border-bottom: 1px solid rgba(255,255,255,.06);
                font-size: 10px;
                color: var(--muted);
                user-select: none;
            }

            .term-min {
                margin-left: auto;
                font-size: 14px;
                line-height: 1;
            }

            @media (max-width: 600px) {
                .term {
                    right: 16px;
                    bottom: 16px;
                }
            }

            .term-bar i {
                width: 9px;
                height: 9px;
                border-radius: 50%;
                background: #ff5f57;
            }

            .term-bar i:nth-child(2) {
                background: #febc2e;
            }

            .term-bar i:nth-child(3) {
                background: #28c840;
                margin-right: 6px;
            }

            .term-out {
                height: 118px;
                overflow-y: auto;
                padding: 8px 12px 0;
                white-space: pre-wrap;
                word-break: break-word;
                line-height: 1.55;
                scrollbar-width: thin;
                scrollbar-color: var(--wine) transparent;
            }

            .term-out .cmd {
                color: var(--text);
            }

            .term-out .res {
                color: #d7c3c6;
            }

            .term-out .err {
                color: var(--red-glow);
            }

            .term-out a {
                color: var(--red-glow);
            }

            .term-in {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 6px 12px 10px;
            }

            .prompt {
                color: var(--red-glow);
                flex: none;
            }

            .term-in input {
                flex: 1;
                min-width: 0;
                background: none;
                border: 0;
                outline: 0;
                color: var(--text);
                font: inherit;
                caret-color: var(--red-glow);
            }

            #rw {
                position: fixed;
                inset: 0;
                z-index: 95;
                background: #000;
                color: var(--red-glow);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 24px;
                text-align: center;
                overflow: hidden;
            }

            #rw::after {
                content: "";
                position: absolute;
                inset: 0;
                pointer-events: none;
                background: repeating-linear-gradient(0deg, rgba(255,0,0,.06) 0 1px, transparent 1px 3px);
            }

            #rw.shake {
                animation: shake .07s infinite;
            }

            @keyframes shake {
                25% {
                    transform: translate(4px, -3px);
                    filter: hue-rotate(20deg);
                }

                50% {
                    transform: translate(-4px, 2px);
                }

                75% {
                    transform: translate(3px, 4px);
                    filter: invert(1);
                }
            }

            #rw .skull {
                font-size: clamp(8px, 2vw, 13px);
                line-height: 1.05;
                text-shadow: 0 0 12px var(--red-glow);
            }

            #rw h2 {
                font-family: 'Orbitron', sans-serif;
                font-weight: 900;
                font-size: clamp(18px, 4.6vw, 36px);
                letter-spacing: .04em;
                margin: 18px 0 8px;
                text-shadow: 0 0 18px var(--red-glow);
                animation: rwBlink .6s steps(1) infinite;
            }

            @keyframes rwBlink {
                50% {
                    color: #fff;
                }
            }

            #rw .sub {
                color: #d7c3c6;
                font-size: 13px;
                line-height: 1.6;
            }

            #rw .sub.hax {
                font-size: 12px;
                color: #8a7174;
                letter-spacing: .02em;
            }

            #rw .sub.hax span {
                color: var(--red-glow);
            }

            #rw .sub.hax i {
                font-style: normal;
                color: #3a2a2d;
            }

            #rw .files {
                margin-top: 16px;
                width: min(600px, 100%);
                height: 130px;
                overflow: hidden;
                text-align: left;
                font-size: 11px;
                line-height: 1.6;
                color: #8a7174;
                -webkit-mask-image: linear-gradient(transparent, #000 45%);
                mask-image: linear-gradient(transparent, #000 45%);
            }

            #rw .files span {
                color: var(--red-glow);
            }

            #rw .timer {
                margin-top: 14px;
                font-family: 'Orbitron', sans-serif;
                font-size: clamp(24px, 6vw, 40px);
                color: #fff;
                text-shadow: 0 0 14px var(--red-glow);
                font-variant-numeric: tabular-nums;
            }

            /* odsłona żartu - w tym samym stylu co reszta strony */
            #rw.joke {
                cursor: pointer;
                background: radial-gradient(ellipse at center, #140407, #000 70%);
            }

            #rw.joke::after {
                opacity: .4;
            }

            .joke-box {
                animation: jokeIn .7s cubic-bezier(.2,.9,.2,1) both;
            }

            @keyframes jokeIn {
                from {
                    opacity: 0;
                    transform: translateY(14px) scale(.97);
                    filter: blur(6px);
                }
            }

            .joke-cmd {
                font-size: 12px;
                color: #8a7174;
                margin-bottom: 14px;
            }

            .joke-cmd span {
                color: var(--red-glow);
            }

            #rw.joke h2.nick {
                margin: 0;
                font-size: clamp(30px, 8vw, 56px);
                color: transparent;
                text-shadow: none;
                animation: shine 5s linear infinite;
            }

            .joke-line {
                width: 60px;
                height: 1px;
                margin: 18px auto;
                background: linear-gradient(90deg, transparent, var(--red-glow), transparent);
            }

            #rw.joke .sub {
                color: var(--muted);
                font-size: 12px;
                letter-spacing: .08em;
            }

            #rw .back {
                margin-top: 30px;
                font-family: 'Orbitron', sans-serif;
                font-size: 12px;
                letter-spacing: .5em;
                color: var(--muted);
                animation: pulse 1.8s ease-in-out infinite;
            }

            .footer {
                margin-top: 24px;
                padding-top: 16px;
                border-top: 1px solid rgba(255,255,255,.07);
                display: flex;
                justify-content: space-between;
                font-size: 11px;
                color: var(--muted);
            }

            .views svg {
                width: 13px;
                height: 13px;
                fill: currentColor;
                vertical-align: -2px;
                margin-right: 4px;
            }
        </style>
    </head>
